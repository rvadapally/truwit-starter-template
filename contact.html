<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Truwit</title>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="nav">
        <div class="container nav-container">
            <a href="/" class="nav-logo">Truwit</a>
            <button class="mobile-menu-toggle" aria-label="Toggle menu"><span>â˜°</span></button>
            <ul class="nav-menu">
                <li><a href="/how-it-works.html">How It Works</a></li>
                <li><a href="/use-cases.html">Use Cases</a></li>
                <li><a href="/technology.html">Technology</a></li>
                <li><a href="/pricing.html">Pricing</a></li>

                <li><a href="/investors.html">Investors</a></li>
                <li><a href="/app/" class="nav-cta">Try App</a></li>
            </ul>
        </div>
    </nav>
    <section class="hero">
        <div class="container">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you</p>
        </div>
    </section>
    <section class="section">
        <div class="container">
            <div style="max-width: 600px; margin: 0 auto;">
                <form id="contact-form" style="background: white; padding: var(--spacing-xl); border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" required>
                            <option value="">Select a subject...</option>
                            <option value="general">General Inquiry</option>
                            <option value="sales">Sales</option>
                            <option value="support">Support</option>
                            <option value="press">Press</option>
                            <option value="investor">Investor Relations</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
                <div style="margin-top: var(--spacing-xl); text-align: center;">
                    <h3 style="margin-bottom: var(--spacing-md);">Direct Contact</h3>
                    <p style="color: var(--color-text-light); margin-bottom: var(--spacing-sm);">Email: <a href="mailto:hello@truwit.ai" style="color: var(--color-accent);">hello@truwit.ai</a></p>
                    <p style="color: var(--color-text-light);">Twitter/X: <a href="https://x.com/TruwitAi" target="_blank" rel="noopener" style="color: var(--color-accent);">@TruwitAi</a></p>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>Â© 2025 Truwit. All rights reserved.</p></div>
        </div>
    </footer>
    <script src="/js/main.js"></script>
</body>
</html>
