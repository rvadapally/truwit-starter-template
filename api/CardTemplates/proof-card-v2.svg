<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    
    <!-- Accent gradient (teal/cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    
    <!-- Bitcoin gold gradient -->
    <linearGradient id="bitcoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    
    <!-- Card glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="0"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0  0 0.8 0 0 0.9  0 0.5 0 0 1  0 0 0 0.5 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="256" x2="1024" y2="256" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="512" x2="1024" y2="512" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="768" x2="1024" y2="768" stroke="#00d9ff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="1024" stroke="#00d9ff" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="#00d9ff" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="1024" stroke="#00d9ff" stroke-width="1"/>
  </g>

  <!-- Main verification badge -->
  <g filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="512" cy="380" r="220" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>
    
    <!-- Inner filled circle -->
    <circle cx="512" cy="380" r="180" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="2"/>
    
    <!-- Checkmark -->
    <path d="M430 380 l60 60 l110 -130" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "VERIFIED" text -->
  <text x="512" y="640" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="12">VERIFIED</text>
  
  <!-- Bitcoin Anchored badge -->
  <g transform="translate(512, 720)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="url(#bitcoinGrad)"/>
    <text x="0" y="8" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a2e" letter-spacing="1">⚡ BITCOIN ANCHORED</text>
  </g>

  <!-- Proof ID card -->
  <g>
    <rect x="162" y="780" width="700" height="180" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- TruWit branding -->
    <text x="200" y="830" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">truwit.ai/t/</text>
    
    <!-- Proof ID -->
    <text x="200" y="880" font-family="'SF Pro Text', 'Monaco', monospace" font-size="36" font-weight="600" fill="#00d9ff">{PROOF_ID}</text>
    
    <!-- QR code placeholder -->
    <rect x="700" y="810" width="130" height="130" rx="8" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- Decorative corner elements -->
  <path d="M40 40 L40 100 M40 40 L100 40" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M984 40 L984 100 M984 40 L924 40" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M40 984 L40 924 M40 984 L100 984" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M984 984 L984 924 M984 984 L924 984" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
