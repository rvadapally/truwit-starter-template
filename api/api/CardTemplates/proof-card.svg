<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>
  
  <!-- Circular badge -->
  <circle cx="512" cy="300" r="120" fill="url(#badgeGradient)" stroke="#fff" stroke-width="4"/>
  
  <!-- Checkmark in badge -->
  <path d="M 480 300 L 500 320 L 544 276" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Main title -->
  <text x="512" y="480" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
    Verified by TruWit
  </text>
  
  <!-- Proof ID -->
  <text x="512" y="540" text-anchor="middle" fill="#4CAF50" font-family="Arial, sans-serif" font-size="36" font-weight="bold">
    {SHORT_ID}
  </text>
  
  <!-- URL -->
  <text x="512" y="600" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="24">
    {URL}
  </text>
  
  <!-- QR Code placeholder (will be replaced by actual QR code) -->
  <rect x="400" y="700" width="224" height="224" fill="#fff" stroke="#4CAF50" stroke-width="2" rx="8"/>
  <text x="512" y="750" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="16">
    QR Code
  </text>
  
  <!-- Footer -->
  <text x="512" y="980" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="16">
    TruWit.ai - Trust &amp; Verify
  </text>
</svg>
