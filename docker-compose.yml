version: '3.8'

services:
  # PostgreSQL Database (matching Railway)
  postgres:
    image: postgres:15
    container_name: truwit-postgres
    environment:
      POSTGRES_DB: truwit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # .NET API (matching Railway deployment)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: truwit-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Database__Type=postgres
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=truwit;Username=postgres;Password=password;Include Error Detail=true
      - YTDLP_COOKIES=/app/cookies.txt
    volumes:
      - ./api/cookies.txt:/app/cookies.txt
      - api_data:/app/data
      - api_temp:/app/temp
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  api_data:
  api_temp:
  api_logs:
